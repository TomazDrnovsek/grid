plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
    // ✅ UNCHANGED: Keep existing working dependencies
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.core:core-ktx:1.13.1"
}

android {
    // 🚨 CRITICAL CHANGE: Production package name (you can adjust this)
    namespace = "si.tomazdrnovsek.grid"

    // ✅ GOOGLE PLAY REQUIREMENT: Explicit API 35 for new apps (Aug 2025+)
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        // 🚨 CRITICAL CHANGE: Must match namespace above
        applicationId = "si.tomazdrnovsek.grid"

        // ✅ UNCHANGED: Keep existing minimum SDK support
        minSdk = flutter.minSdkVersion

        // 🚨 GOOGLE PLAY REQUIREMENT: Explicit API 35 target
        targetSdk = 35

        // ✅ PRODUCTION VERSIONING: Ready for first release
        versionCode = 2
        versionName = "1.0.1"
    }

    // 🔐 SIGNING CONFIGURATION: Will read from key.properties
    signingConfigs {
        release {
            if (project.hasProperty('android.injected.signing.store.file')) {
                // Used by Android Studio build
                storeFile file(project.property('android.injected.signing.store.file'))
                storePassword project.property('android.injected.signing.store.password')
                keyAlias project.property('android.injected.signing.key.alias')
                keyPassword project.property('android.injected.signing.key.password')
            } else {
                // Read from key.properties file (we'll create this next)
                def keystoreProperties = new Properties()
                def keystorePropertiesFile = rootProject.file('key.properties')
                if (keystorePropertiesFile.exists()) {
                    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
            }
        }
    }

    buildTypes {
        release {
            // 🔐 PRODUCTION SIGNING: Use release keystore
            signingConfig signingConfigs.release

            // 🚀 MINIMAL OPTIMIZATIONS: Safe for production
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // ✅ UNCHANGED: Keep debug build as-is
        debug {
            // Keep existing debug configuration
        }
    }
}

flutter {
    source = "../.."
}