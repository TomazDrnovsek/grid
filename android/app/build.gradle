plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.core:core-ktx:1.13.1"
}

android {
    // An address: never changes (CLAUDE.md §6)
    namespace = "si.tomazdrnovsek.grid"

    // ✅ GOOGLE PLAY REQUIREMENT: Explicit API 36 for new apps (Aug 2026+)
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        // An address: never changes (CLAUDE.md §6). Same value as namespace
        applicationId = "si.tomazdrnovsek.grid"

        // Android 7.0: Play automatic protection requires a minimum SDK of 24 (G-014)
        minSdk = 24

        // 🚨 GOOGLE PLAY REQUIREMENT (Aug 2026): Target API 36
        targetSdk = 36

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // 🔐 SIGNING: Android Studio's injected properties if present, otherwise key.properties
    signingConfigs {
        release {
            if (project.hasProperty('android.injected.signing.store.file')) {
                // Used by Android Studio build
                storeFile file(project.property('android.injected.signing.store.file'))
                storePassword project.property('android.injected.signing.store.password')
                keyAlias project.property('android.injected.signing.key.alias')
                keyPassword project.property('android.injected.signing.key.password')
            } else {
                // android/key.properties; CI writes it (G-007). Without it a release build
                // fails at :app:signReleaseBundle (CLAUDE.md §8)
                def keystoreProperties = new Properties()
                def keystorePropertiesFile = rootProject.file('key.properties')
                if (keystorePropertiesFile.exists()) {
                    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                }
            }
        }
    }

    buildTypes {
        release {
            // 🔐 PRODUCTION SIGNING: Use release keystore
            signingConfig signingConfigs.release

            // R8 minification and resource shrinking, with Android's default optimize rules
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }

        // No overrides: Android's debug defaults
        debug {
        }
    }
}

flutter {
    source = "../.."
}